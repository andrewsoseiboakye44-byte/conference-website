<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E40AF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Concentric Circular Rings for Modern Aura -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="200" cy="180" r="170" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.3"/>

  <!-- Speaker Head & Shoulders Silhouette -->
  <g filter="url(#softGlow)">
    <!-- Head -->
    <circle cx="200" cy="150" r="54" fill="url(#avatarGrad)" />
    
    <!-- Torso / Shoulders -->
    <path d="M 105 340 C 105 245, 142 228, 200 228 C 258 228, 295 245, 295 340 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Microphone Badge Accent -->
  <g transform="translate(230, 240)">
    <circle cx="24" cy="24" r="26" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="24" cy="24" r="21" fill="#2563EB"/>
    <!-- Mic icon -->
    <path d="M 24 13 C 21.8 13 20 14.8 20 17 L 20 22 C 20 24.2 21.8 26 24 26 C 26.2 26 28 24.2 28 22 L 28 17 C 28 14.8 26.2 13 24 13 Z" fill="#FFFFFF"/>
    <path d="M 16.5 20.5 C 16.5 24.6 19.8 28 24 28 C 28.2 28 31.5 24.6 31.5 20.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="28" x2="24" y2="33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="33" x2="28" y2="33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
